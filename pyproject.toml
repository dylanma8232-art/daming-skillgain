[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daming-skillgain"
version = "2.1.1"
description = "Pre-release quality gate for AI Agent Skills — paired with/without evaluation, deterministic assertions, blind judge review, and self-contained HTML reports."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "dylanma8232-art"}
]
keywords = [
    "ai-agent",
    "skills",
    "evaluation",
    "benchmark",
    "llm-eval",
    "claude-code",
    "codex",
    "opencode",
    "cursor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
mcp = [
    "mcp>=1.30,<2",
]
anthropic = [
    "anthropic>=0.18.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.10.0",
]
all = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "mcp>=1.30,<2",
    "anthropic>=0.18.0",
]

[project.scripts]
skillgain = "evaluator.cli:main"
daming-skillgain = "evaluator.cli:main"

[project.urls]
Homepage = "https://github.com/dylanma8232-art/daming-skillgain"
Repository = "https://github.com/dylanma8232-art/daming-skillgain"
Issues = "https://github.com/dylanma8232-art/daming-skillgain/issues"
Changelog = "https://github.com/dylanma8232-art/daming-skillgain/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["evaluator*"]
