name: Weekly Optimization

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for Jules
        run: |
          gh issue create \
            --title "每周代码优化和TODO清理" \
            --body "@jules 请全自动扫描代码库中的 TODO 和性能优化点，修改并提 PR" \
            --label "enhancement" \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
