name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package & test deps
        run: |
          pip install -e ".[api,mcp,dev]"
      - name: Run unit tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          skillgain --version
          skillgain doctor
          skillgain demo --output /tmp/smoke-demo-report.html
          test -s /tmp/smoke-demo-report.html
