name: Auto-merge Jules PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: auto-merge-jules-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Identify Jules PR
        id: identify
        env:
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # 1. Fork and Repo Check: Head repo must match target repo and must not be a fork
          IS_SAME_REPO=false
          if [ "$IS_FORK" = "false" ] && [ "$HEAD_REPO" = "$TARGET_REPO" ]; then
            IS_SAME_REPO=true
          fi

          # 2. Author Check: PR user must be repository owner or a recognized Jules bot account
          PR_USER_LOWER=$(printf '%s' "$PR_USER" | tr '[:upper:]' '[:lower:]')
          REPO_OWNER_LOWER=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')

          IS_TRUSTED_USER=false
          if [ "$PR_USER_LOWER" = "$REPO_OWNER_LOWER" ]; then
            IS_TRUSTED_USER=true
          elif [ "$PR_USER_LOWER" = "google-jules-app[bot]" ] || [ "$PR_USER_LOWER" = "jules[bot]" ] || [ "$PR_USER_LOWER" = "github-actions[bot]" ]; then
            IS_TRUSTED_USER=true
          fi

          # 3. Content Check: Body or Branch matching Jules pattern
          IS_JULES_PATTERN=false
          if printf '%s' "$BODY" | grep -q "PR created automatically by Jules" || printf '%s' "$BRANCH" | grep -Eq '[0-9]{15}'; then
            IS_JULES_PATTERN=true
          fi

          if [ "$IS_SAME_REPO" = "true" ] && [ "$IS_TRUSTED_USER" = "true" ] && [ "$IS_JULES_PATTERN" = "true" ]; then
            echo "is_jules=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_jules=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark ready for review
        if: steps.identify.outputs.is_jules == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr view "$PR_URL" --json isDraft -q '.isDraft' | grep -q 'true'; then
            echo "Draft PR detected, marking ready for review..."
            gh pr ready "$PR_URL"
          else
            echo "PR already ready for review."
          fi

      - name: Approve PR
        if: steps.identify.outputs.is_jules == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review "$PR_URL" --approve --body "Auto-approved by Jules (CI-gated)." || echo "approve skipped"

      - name: Wait for CI then merge
        if: steps.identify.outputs.is_jules == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for CI on $PR_URL (sha=$SHA)..."
          for i in $(seq 1 90); do
            CONC=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" -q '[.check_runs[] | select(.name=="ci")] | sort_by(.started_at // "0") | .[-1].conclusion // "pending"' 2>/dev/null || echo pending)
            case "$CONC" in
              success)
                echo "CI passed, merging..."
                gh pr merge "$PR_URL" --squash --delete-branch
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|skipped|stale)
                echo "::error::CI concluded '$CONC', not merging."
                exit 1
                ;;
              *)
                echo "CI status=$CONC (poll $i/90), waiting..."
                sleep 20
                ;;
            esac
          done
          echo "::error::CI did not complete within 30 min, not merging."
          exit 1

      - name: Checkout main for iteration log
        if: steps.identify.outputs.is_jules == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record iteration in Chinese
        if: steps.identify.outputs.is_jules == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main
          NUM=${{ github.event.pull_request.number }}
          TITLE=$(gh pr view "$PR_URL" --json title -q '.title')
          FILES=$(gh pr view "$PR_URL" --json files -q '.files[].path')
          DATE=$(date -u "+%Y-%m-%d %H:%M")
          {
            echo ""
            echo "## ${DATE} 迭代"
            echo ""
            echo "- **PR**：${NUM} ${TITLE}"
            echo "- **链接**：${PR_URL}"
            echo "- **改动文件**："
            echo "${FILES}" | sed 's/^/- /'
          } >> CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "docs(迭代): 记录 PR #${NUM} 的改动" || true
          git push origin main || true
