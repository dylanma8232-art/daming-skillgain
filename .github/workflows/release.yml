name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package Skill ZIP
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_DIR="daming-skillgain"
          mkdir -p "${PKG_DIR}"
          cp -r SKILL.md README.md README_EN.md CHANGELOG.md LICENSE pyproject.toml requirements.txt evaluator references examples "${PKG_DIR}/"
          mkdir -p "${PKG_DIR}/assets"
          cp assets/report-screenshot.png "${PKG_DIR}/assets/"
          find "${PKG_DIR}" -name "__pycache__" -type d -exec rm -rf {} +
          zip -r "daming-skillgain-${TAG}.zip" "${PKG_DIR}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk -v tag="${TAG}" '
            /^## / {
              if (found) exit
              for (i = 1; i <= NF; i++) if ($ i == tag) found = 1
              next
            }
            found && $0 != "---" { print }
          ' CHANGELOG.md > release-notes.md
          NOTES=(--generate-notes)
          if [ -s release-notes.md ]; then NOTES=(--notes-file release-notes.md); fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "daming-skillgain-${TAG}.zip" --clobber
          else
            gh release create "${TAG}" "daming-skillgain-${TAG}.zip" \
              --title "${TAG}" \
              "${NOTES[@]}"
          fi
